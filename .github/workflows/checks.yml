name: Windows read-only regression
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readonly:
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Synthetic read-only checks (no Recycle Bin calls)
        shell: pwsh
        working-directory: scripts
        run: |
          $env:CLEANUP_TEST_ROOT = Join-Path $env:RUNNER_TEMP 'codex-cleanup-readonly'
          New-Item -ItemType Directory -Path $env:CLEANUP_TEST_ROOT -Force | Out-Null
          $env:PYTHONUTF8 = '1'
          python -B -m unittest -v test_inventory test_scan_panel.PanelTests.test_scan_only_and_no_broad_legacy_report_on_boot test_scan_panel.PanelTests.test_new_empty_association_report_cannot_hide_valid_project_and_artifact_results test_scan_panel.PanelTests.test_old_cleanup_apis_and_scope_expansion_are_rejected test_scan_panel.PanelTests.test_cross_origin_and_missing_token_rejected test_scan_panel.PanelTests.test_scan_cancellation_preserves_sources_and_releases_lock test_scan_panel.PanelTests.test_stop_does_not_change_authorization test_project_inventory.ProjectInventoryTests.test_all_registered_projects_and_tasks_in_scope_without_common_folders test_project_inventory.ProjectInventoryTests.test_source_contents_not_read_and_generic_user_roots_rejected test_project_inventory.ProjectInventoryTests.test_final_output_source_code_and_changed_identity_not_selectable test_project_inventory.ProjectInventoryTests.test_automatic_generated_artifacts_require_format_source_and_producer_evidence test_file_cleanup.FileCleanupTests.test_scan_does_not_authorize_and_protected_files_cannot_enter test_file_cleanup.FileCleanupTests.test_changed_file_and_new_protection_block_processing test_file_cleanup.FileCleanupTests.test_new_git_tracking_blocks_even_with_sync_confirmation test_file_cleanup.FileCleanupTests.test_pause_blocks_cleanup_but_not_recovery test_safe_cleanup.SafetyTests.test_legacy_mutating_cli_stops_before_creating_state test_discovery_rules test_scan_cursor test_generated_rules test_portability.PortabilityTests.test_launcher_skips_broken_and_old_candidates test_portability.PortabilityTests.test_explicit_invalid_interpreter_is_clear test_portability.PortabilityTests.test_git_missing_diagnostic_keeps_readonly_capabilities test_scan_panel.PanelTests.test_project_filter_rejects_unregistered_paths test_file_cleanup.FileCleanupTests.test_runtime_cache_scan_and_preview_share_git_keep_and_config_protections test_portable.PortableTests.test_unverified_runtime_is_rejected_before_output_creation


  portable:
    name: Windows x64 portable bundle
    needs: readonly
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Verify official runtime and build portable archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $runtimeArchive = Join-Path $env:RUNNER_TEMP 'python-3.14.10-embed-amd64.zip'
          Invoke-WebRequest 'https://www.python.org/ftp/python/3.14.10/python-3.14.10-embed-amd64.zip' -OutFile $runtimeArchive
          if ((Get-FileHash -LiteralPath $runtimeArchive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '90905e64a840557d8c1bc4f5b74db3d7ee85e3ffb217611cac1c7813acea4159') { throw 'Official runtime checksum mismatch' }
          $bundle = Join-Path $env:RUNNER_TEMP 'CodexSafeCleanup-Windows-x64'
          python -X utf8 -B scripts/build_portable.py --python-zip $runtimeArchive --destination $bundle
          if ($LASTEXITCODE -ne 0) { throw 'Portable build failed' }
      - name: Launch using only the bundled Python
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = Join-Path $env:RUNNER_TEMP 'CodexSafeCleanup-Windows-x64'
          $env:USERPROFILE = Join-Path $env:RUNNER_TEMP 'portable-empty-user'
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'portable-empty-local'
          $env:CODEX_HOME = Join-Path $env:USERPROFILE '.codex'
          $env:PYTHONHOME = Join-Path $env:RUNNER_TEMP 'no-host-python'
          $env:PYTHONPATH = Join-Path $env:RUNNER_TEMP 'untrusted-import-path'
          $env:PATH = Join-Path $env:SystemRoot 'System32'
          New-Item -ItemType Directory -Path $env:USERPROFILE,$env:LOCALAPPDATA -Force | Out-Null
          Push-Location $bundle
          try {
            $output = & .\Start.cmd --diagnose --state (Join-Path $env:LOCALAPPDATA 'state')
            if ($LASTEXITCODE -ne 0) { throw 'Portable launcher failed' }
            $diagnostic = $output[-1] | ConvertFrom-Json
            $pythonCheck = $diagnostic.diagnostics | Where-Object feature -eq 'Python'
            if (!$pythonCheck.available -or !$pythonCheck.detail.Contains($bundle)) { throw 'Bundled Python was not used' }
            & .\runtime\python.exe -X utf8 -c "import sys,shutil; assert sys.flags.isolated == 1; assert shutil.which('python') is None; import inventory,scan_panel"
            if ($LASTEXITCODE -ne 0) { throw 'Portable isolation check failed' }
          } finally { Pop-Location }
      - uses: actions/upload-artifact@v7.0.2
        with:
          path: ${{ runner.temp }}/CodexSafeCleanup-Windows-x64.zip
          archive: false
          if-no-files-found: error
          retention-days: 30
