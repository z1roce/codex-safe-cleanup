name: Windows read-only regression
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readonly:
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Synthetic read-only checks (no Recycle Bin calls)
        shell: pwsh
        working-directory: scripts
        run: |
          $env:CLEANUP_TEST_ROOT = Join-Path $env:RUNNER_TEMP 'codex-cleanup-readonly'
          New-Item -ItemType Directory -Path $env:CLEANUP_TEST_ROOT -Force | Out-Null
          $env:PYTHONUTF8 = '1'
          python -B -m unittest -v test_inventory test_scan_panel.PanelTests.test_scan_only_and_no_broad_legacy_report_on_boot test_scan_panel.PanelTests.test_new_empty_association_report_cannot_hide_valid_project_and_artifact_results test_scan_panel.PanelTests.test_old_cleanup_apis_and_scope_expansion_are_rejected test_scan_panel.PanelTests.test_cross_origin_and_missing_token_rejected test_scan_panel.PanelTests.test_scan_cancellation_preserves_sources_and_releases_lock test_scan_panel.PanelTests.test_stop_does_not_change_authorization test_project_inventory.ProjectInventoryTests.test_all_registered_projects_and_tasks_in_scope_without_common_folders test_project_inventory.ProjectInventoryTests.test_source_contents_not_read_and_generic_user_roots_rejected test_project_inventory.ProjectInventoryTests.test_final_output_source_code_and_changed_identity_not_selectable test_project_inventory.ProjectInventoryTests.test_automatic_generated_artifacts_require_format_source_and_producer_evidence test_file_cleanup.FileCleanupTests.test_scan_does_not_authorize_and_protected_files_cannot_enter test_file_cleanup.FileCleanupTests.test_changed_file_and_new_protection_block_processing test_file_cleanup.FileCleanupTests.test_new_git_tracking_blocks_even_with_sync_confirmation test_file_cleanup.FileCleanupTests.test_pause_blocks_cleanup_but_not_recovery test_safe_cleanup.SafetyTests.test_legacy_mutating_cli_stops_before_creating_state test_discovery_rules test_portability.PortabilityTests.test_launcher_skips_broken_and_old_candidates test_portability.PortabilityTests.test_explicit_invalid_interpreter_is_clear test_portability.PortabilityTests.test_git_missing_diagnostic_keeps_readonly_capabilities test_scan_panel.PanelTests.test_project_filter_rejects_unregistered_paths

